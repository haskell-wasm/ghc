    <script>
      window.esmsInitOptions = {
        shimMode: true,
        resolve(id, parent, resolve) {
          const match = /^(@codingame\/monaco-vscode-[^/]+)(?:\/(.*))?$/.exec(id);
          if (!match) return resolve(id, parent);
          let path = match[2];
          if (match[1] === "@codingame/monaco-vscode-api") {
            path = path?.startsWith("vscode/") ? "vscode/src/" + path.slice(7) : path || "services";
          } else if (match[1] === "@codingame/monaco-vscode-editor-api") {
            path ||= "esm/vs/editor/editor.api";
          } else {
            path ||= "index";
          }

          return `https://cdn.jsdelivr.net/npm/${match[1]}@37.0.0/${path}`;
        },
        async fetch(url, options) {
          const response = await fetch(url, options);
          if (!response.ok || !url.endsWith(".css")) return response;
          const css = (await response.text()).replace(
            /url\((['"]?)([^)'"\s]+)\1\)/g,
            (_, quote, path) => `url("${new URL(path, url).href}")`

          return new Response(`export default ${JSON.stringify(css)}`, {
            headers: { "Content-Type": "text/javascript" },
          });
        },
        onerror(error) {
          const status = document.getElementById("status");
          if (status) {
            status.textContent = error.message;
            status.dataset.error = "true";
          }
          console.error(error);
        },
      };

      async function save(entry) {
        clearTimeout(entry.timer);
        const saved = await entry.reference.object.save();
        if (!saved && entry.reference.object.isDirty()) throw new Error(`Could not save ${entry.path.slice(workspace.length + 1)}`);
        markSaved();
      }
      async function saveAll() { await Promise.all([...models.values()].map(save)); }
      function renderTabs() {
        $("tabs").replaceChildren();
        for (const [path, entry] of models) {
          const tab = document.createElement("div");
          tab.className = "tab" + (path === activePath ? " active" : "");
          const button = document.createElement("button");
          button.textContent = path.split("/").at(-1) + (entry.reference.object.isDirty() ? " ●" : "");
          button.title = path.slice(workspace.length + 1);
          button.setAttribute("role", "tab");
          button.setAttribute("aria-selected", String(path === activePath));
          button.onclick = () => run(() => openFile(path));
          const close = document.createElement("button");
          close.className = "close-tab";
          close.textContent = "×";
          close.setAttribute("aria-label", `Close ${button.title}`);
          close.onclick = () => run(() => closeFile(path));
          tab.append(button, close);
          $("tabs").append(tab);
        }
        $("load-file").disabled = !running || !activePath;
      }
      function select(path, type) {
        selectedPath = path;
        selectedType = type;
        $("rename-file").disabled = $("delete-file").disabled = !path;
        for (const element of $("files").querySelectorAll("[data-path]")) {
          element.setAttribute("aria-current", String(element.dataset.path === path));
        }
      }
      async function openFile(path) {
        if (activePath) models.get(activePath).viewState = editor.saveViewState();
        let entry = models.get(path);
        if (!entry) {
          const reference = await monaco.editor.createModelReference(monaco.Uri.file(path));
          entry = { path, reference, subscriptions: [] };
          models.set(path, entry);
          entry.subscriptions.push(reference.object.textEditorModel.onDidChangeContent(() => {
            clearTimeout(entry.timer);
            markSaved();
            entry.timer = setTimeout(() => run(() => save(entry)), 300);
          }));
          entry.subscriptions.push(reference.object.onDidChangeDirty(markSaved));
        }
        activePath = path;
        editor.setModel(entry.reference.object.textEditorModel);
        if (entry.viewState) editor.restoreViewState(entry.viewState);
        $("empty-editor").hidden = true;
        $("editor").hidden = false;
        select(path, FileType.File);
        renderTabs();
        editor.focus();
      }
      async function closeFile(path, deleted = false) {
        const entry = models.get(path);
        if (!entry) return;
        if (!deleted) await save(entry);
        clearTimeout(entry.timer);
        entry.subscriptions.forEach((subscription) => subscription.dispose());
        models.delete(path);
        if (activePath === path) {
          activePath = undefined;
          editor.setModel(null);
          const next = [...models.keys()].at(-1);
          if (next) await openFile(next);
        }
        entry.reference.dispose();
        $("empty-editor").hidden = !!activePath;
        $("editor").hidden = !activePath;
        renderTabs();
      }
      async function refreshTree() {
        const expanded = new Set([...$("files").querySelectorAll("details[open]")].map((element) => element.dataset.path));
        async function directory(path) {
          const container = document.createElement("div");
          const entries = await runtime.fs.readdir(path);
          entries.sort(([a, at], [b, bt]) => (bt === FileType.Directory) - (at === FileType.Directory) || a.localeCompare(b));
          for (const [name, type] of entries) {
            const childPath = path + "/" + name;
            if (type === FileType.Directory) {
              const details = document.createElement("details");
              details.dataset.path = childPath;
              details.open = expanded.has(childPath) || !!selectedPath?.startsWith(childPath + "/");
              const summary = document.createElement("summary");
              summary.dataset.path = childPath;
              summary.textContent = name;
              summary.onclick = () => select(childPath, type);
              details.append(summary, await directory(childPath));
              container.append(details);
            } else {
              const button = document.createElement("button");
              button.className = "file-row";
              button.dataset.path = childPath;
              button.title = childPath.slice(workspace.length + 1);
              const icon = document.createElement("span");
              icon.className = "file-icon";
              icon.setAttribute("aria-hidden", "true");
              icon.textContent = /\.lhs?$/.test(name) || name.endsWith(".hs") ? "λ" : "·";
              button.append(icon, document.createTextNode(name));
              button.onclick = () => run(() => openFile(childPath));
              container.append(button);
            }
          }
          return container;
        }
        $("files").replaceChildren(await directory(workspace));
        select(selectedPath, selectedType);
      }

      let fileAction;
      function fileDialog(action) {
        fileAction = action;
        const removing = action === "delete";
        const renaming = action === "rename";
        $("file-dialog-title").textContent = { file: "New file", folder: "New folder", rename: "Rename", delete: "Delete" }[action];
        $("file-dialog-description").hidden = !removing;
        $("file-dialog-description").textContent = removing ? `Delete ${selectedPath.slice(workspace.length + 1)}${selectedType === FileType.Directory ? " and its contents" : ""}? This cannot be undone.` : "";
        $("file-name-label").hidden = removing;
        $("file-name").required = !removing;
        $("file-name").value = renaming ? selectedPath.slice(workspace.length + 1) : selectedType === FileType.Directory ? selectedPath.slice(workspace.length + 1) + "/" : "";
        $("confirm-file").textContent = removing ? "Delete" : renaming ? "Rename" : "Create";
        $("file-error").textContent = "";
        $("file-dialog").showModal();
        if (!removing) { $("file-name").focus(); if (renaming) $("file-name").select(); }
      }
      async function ensureParents(path) {
        let parent = workspace;
        for (const part of path.slice(workspace.length + 1).split("/").slice(0, -1)) {
          parent += "/" + part;
          try { await runtime.fs.stat(parent); }
          catch (error) {
            if (error.name !== "NotFoundError" && error.code !== "FileNotFound" && error.code !== FileSystemProviderErrorCode.FileNotFound) throw error;
            await runtime.fs.mkdir(parent);
          }
        }
      }
      $("file-form").onsubmit = (event) => {
        event.preventDefault();
        run(async () => {
          $("confirm-file").disabled = true;
          try {
            const name = $("file-name").value.trim();
            if (fileAction !== "delete" && (!name || name.split("/").some((part) => !part || part === "." || part === "..") || /[\0\\]/.test(name))) {
              throw new Error("Enter a relative path with a name for each folder and file.");
            }
            const path = workspace + "/" + name;
            if (fileAction === "file" || fileAction === "folder") {
              await ensureParents(path);
              if (fileAction === "file") {
                await runtime.fs.writeFile(path, new Uint8Array(), { create: true, overwrite: false });
                await openFile(path);
              } else {
                await runtime.fs.mkdir(path);
                select(path, FileType.Directory);
              }
            } else {
              const previous = selectedPath;
              const previousType = selectedType;
              const affected = [...models.keys()].filter((key) => key === previous || key.startsWith(previous + "/"));
              await saveAll();
              if (fileAction === "rename") {
                await ensureParents(path);
                await runtime.fs.rename(previous, path, { overwrite: false });
                for (const key of affected) { await closeFile(key, true); await openFile(path + key.slice(previous.length)); }
                select(path, previousType);
              } else {
                await runtime.fs.delete(previous, { recursive: selectedType === FileType.Directory });
                for (const key of affected) await closeFile(key, true);
                select(undefined, undefined);
              }
            }
            await refreshTree();
            $("file-dialog").close();
          } catch (error) { $("file-error").textContent = error.message; }
          finally { $("confirm-file").disabled = false; }
        });
      };
      $("cancel-file").onclick = () => $("file-dialog").close();
      $("new-file").onclick = () => fileDialog("file");
      $("new-folder").onclick = () => fileDialog("folder");
      $("rename-file").onclick = () => fileDialog("rename");
      $("delete-file").onclick = () => fileDialog("delete");
      $("save-all").onclick = () => run(saveAll);
      document.addEventListener("keydown", (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
          event.preventDefault();
          if (runtime) run(saveAll);
        }
      });
      window.addEventListener("beforeunload", (event) => {
        if ([...models.values()].some(({ reference }) => reference.object.isDirty())) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
      window.addEventListener("pagehide", () => runtime?.close());

      let line = [], cursor = 0, lineStart, historyIndex = 0, draft = [], terminalQueue = Promise.resolve();
      const history = [];
      const writeTerminal = (text) => new Promise((resolve) => terminal.write(text, resolve));
      const terminalTask = (action) => { terminalQueue = terminalQueue.then(action).catch(report); };
      async function redrawLine() {
        await writeTerminal("");
        if (!lineStart) lineStart = { row: terminal.buffer.active.baseY + terminal.buffer.active.cursorY, column: terminal.buffer.active.cursorX };
        const row = lineStart.row - terminal.buffer.active.baseY;
        await writeTerminal(`\x1b[${Math.max(0, row) + 1};${lineStart.column + 1}H\x1b[J` + line.join(""));
        const tail = line.slice(cursor).join("");
        if (tail) {
          const position = lineStart.column + stringWidth(line.slice(0, cursor).join(""));
          await writeTerminal(`\x1b[${Math.max(0, lineStart.row - terminal.buffer.active.baseY) + Math.floor(position / terminal.cols) + 1};${position % terminal.cols + 1}H`);
        }
      }
      async function submitLine(command = line.join("")) {
        await saveAll();
        if (command && history.at(-1) !== command) history.push(command);
        historyIndex = history.length;
        line = []; cursor = 0; draft = []; lineStart = undefined;
        await writeTerminal("\r\n");
        await runtime.input(command + "\n");
      }
      async function sendCommand(command) {
        if (!running) return;
        line = Array.from(command); cursor = line.length;
        await redrawLine();
        await submitLine(command);
        terminal.focus();
      }
      async function interrupt() {
        line = []; cursor = 0; lineStart = undefined;
        await writeTerminal("^C\r\n");
        await runtime.interrupt();
      }
      terminal.onData((data) => terminalTask(async () => {
        if (!running) return;
        let submitted = false;
        if (data === "\x03") { await interrupt(); return; }
        if (data === "\x04") {
          if (!line.length) await runtime.eof();
          else if (cursor < line.length) { line.splice(cursor, 1); await redrawLine(); }
          return;
        }
        if (data === "\x1b[A" || data === "\x1b[B") {
          if (historyIndex === history.length) draft = [...line];
          historyIndex = Math.max(0, Math.min(history.length, historyIndex + (data === "\x1b[A" ? -1 : 1)));
          line = historyIndex === history.length ? [...draft] : Array.from(history[historyIndex]);
          cursor = line.length;
        } else if (data === "\x1b[D") cursor = Math.max(0, cursor - 1);
        else if (data === "\x1b[C") cursor = Math.min(line.length, cursor + 1);
        else if (data === "\x01" || data === "\x1b[H" || data === "\x1b[1~") cursor = 0;
        else if (data === "\x05" || data === "\x1b[F" || data === "\x1b[4~") cursor = line.length;
        else if (data === "\x7f" || data === "\b") { if (cursor) line.splice(--cursor, 1); }
        else if (data === "\x1b[3~") line.splice(cursor, 1);
        else if (data === "\x15") { line.splice(0, cursor); cursor = 0; }
        else if (data === "\x0b") line.splice(cursor);
        else if (data === "\x0c") { terminal.clear(); return; }
        else if (!data.startsWith("\x1b")) {
          for (const character of data.replace(/\r\n/g, "\n")) {
            if (character === "\r" || character === "\n") { await redrawLine(); await submitLine(); submitted = true; }
            else if (character >= " " || character === "\t") {
              submitted = false;
              const inserted = character === "\t" ? [" ", " "] : [character];
              line.splice(cursor, 0, ...inserted);
              cursor += inserted.length;
            }
          }
        }
        if (!submitted) await redrawLine();
      }));
      $("load-file").onclick = () => terminalTask(() => sendCommand(":load " + JSON.stringify(activePath)));
      $("reload").onclick = () => terminalTask(() => sendCommand(":reload"));
      $("interrupt").onclick = () => terminalTask(interrupt);

      const runtimeOptions = {
        onOutput(text) { output += text; terminal.write(text); if (!line.length) lineStart = undefined; },
        onStatus: status,
        onFilesystemChanges(events) {
          changes.fire(events.map(({ path, type }) => ({ resource: monaco.Uri.file(path), type })));
          clearTimeout(treeTimer);
          treeTimer = setTimeout(() => run(refreshTree), 100);
        },
        onExit(error) {
          running = false;
          $("reload").disabled = $("interrupt").disabled = true;
          renderTabs();
          status(error ? `GHCi stopped: ${error.message || error}` : "GHCi exited. Press Restart to start again.", !!error);
        },
      };
      let ready, restarting;
      async function startRuntime() {
        await runtime.start();
        running = true;
        $("reload").disabled = $("interrupt").disabled = false;
        renderTabs();
        status("GHCi ready");
      }
      function restartRuntime() {
        if (restarting) return restarting;
        running = false;
        $("restart").disabled = $("reload").disabled = $("interrupt").disabled = true;
        renderTabs();
        clearTimeout(treeTimer);
        for (const entry of models.values()) clearTimeout(entry.timer);
        line = []; cursor = 0; lineStart = undefined;
        terminalQueue = Promise.resolve();
        runtime.close();
        ready = restarting = (async () => {
          try {
            status("Restarting GHCi…");
            runtime = await globalThis.createPlaygroundRuntime(runtimeOptions);
            await saveAll();
            await startRuntime();
            terminal.focus();
          } finally {
            restarting = undefined;
            $("restart").disabled = false;
          }
        })();
        return ready;
      }
      $("restart").onclick = () => run(restartRuntime);

      try {
        if (typeof globalThis.createPlaygroundRuntime !== "function") {
          await new Promise((resolve) => window.addEventListener("playground-runtime-ready", resolve, { once: true }));
        }
        runtime = await globalThis.createPlaygroundRuntime(runtimeOptions);
        registerFileSystemOverlay(1, provider);
        await initUserConfiguration(JSON.stringify({
          "editor.fontSize": 14, "editor.minimap.enabled": false, "editor.scrollBeyondLastLine": false,
          "editor.tabSize": 2, "editor.insertSpaces": true, "editor.automaticLayout": true,
          "files.autoSave": "off", "files.eol": "\n",
        }));
        await initialize({ ...getFilesServiceOverride(), ...getModelServiceOverride(), ...getConfigurationServiceOverride() }, $("editor"), {
          workspaceProvider: { workspace: { folderUri: monaco.Uri.file(workspace) }, trusted: true, open: async () => false },
        });
        const workerURL = URL.createObjectURL(new Blob([
          'import "https://esm.sh/@codingame/monaco-vscode-editor-api@37.0.0/esm/vs/editor/editor.worker?bundle";',
        ], { type: "text/javascript" }));
        globalThis.MonacoEnvironment = { getWorker: () => new Worker(workerURL, { type: "module" }) };
        monaco.languages.register({ id: "haskell", extensions: [".hs", ".lhs"], aliases: ["Haskell"] });
        monaco.languages.setMonarchTokensProvider("haskell", {
          keywords: ["as", "case", "class", "data", "default", "deriving", "do", "else", "family", "forall", "foreign", "hiding", "if", "import", "in", "infix", "infixl", "infixr", "instance", "let", "module", "newtype", "of", "qualified", "then", "type", "where"],
          tokenizer: {
            root: [
              [/--.*$/, "comment"], [/\{-/, "comment", "@comment"],
              [/"/, "string", "@string"], [/'(?:[^'\\]|\\.)'/, "string"],
              [/\b(?:0[xX][\da-fA-F]+|\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)\b/, "number"],
              [/[A-Z][\w']*/, "type.identifier"],
              [/[a-z_][\w']*/, { cases: { "@keywords": "keyword", "@default": "identifier" } }],
              [/[!#$%&*+.\/<=>?@\\^|~:-]+/, "operator"],
            ],
            comment: [[/[^\{-]+/, "comment"], [/\{-/, "comment", "@push"], [/-\}/, "comment", "@pop"], [/[\{-]/, "comment"]],
            string: [[/[^\\"]+/, "string"], [/\\./, "string.escape"], [/"/, "string", "@pop"]],
          },
        });
        monaco.languages.setLanguageConfiguration("haskell", {
          comments: { lineComment: "--", blockComment: ["{-", "-}"] },
          brackets: [["{", "}"], ["[", "]"], ["(", ")"]],
          autoClosingPairs: [{ open: "(", close: ")" }, { open: "[", close: "]" }, { open: "{", close: "}" }, { open: '"', close: '"', notIn: ["string", "comment"] }],
        });
        editor = monaco.editor.create($("editor"), { model: null, theme: "vs-dark", automaticLayout: true });
        await refreshTree();
        const files = await runtime.fs.readdir(workspace);
        const initial = files.find(([name, type]) => type === FileType.File && name === "Main.hs") || files.find(([, type]) => type === FileType.File);
        if (initial) await openFile(workspace + "/" + initial[0]);
        else { $("empty-editor").hidden = false; $("editor").hidden = true; }
        $("new-file").disabled = $("new-folder").disabled = $("save-all").disabled = false;
        markSaved();
        ready = startRuntime();
        globalThis.playground = {
          get runtime() { return runtime; }, get fs() { return runtime.fs; }, get ready() { return ready; },
          editor, models, terminal, saveAll, openFile, closeFile, refreshTree, sendCommand,
          restart: restartRuntime, get output() { return output; },
        };
        $("restart").disabled = false;
        await ready;
      } catch (error) { report(error); terminal.writeln(`\r\n${error.message}`); }
    </script>
  </body>
</html>
